<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" shape-rendering="crispEdges">
  <rect width="512" height="512" rx="64" fill="#3a3a3a" />
  <!-- Pixel Border Outer -->
  <rect x="64" y="64" width="384" height="384" fill="#1e1e1e" />
  <!-- Pixel Coin Outer Gold -->
  <rect x="96" y="96" width="320" height="320" fill="#f59e0b" />
  <!-- Pixel Coin Inner Light Gold -->
  <rect x="128" y="128" width="256" height="256" fill="#fbbf24" />
  <!-- Pixel Coin Highlight Top-Left -->
  <rect x="128" y="128" width="224" height="32" fill="#fef08a" />
  <rect x="128" y="128" width="32" height="224" fill="#fef08a" />
  <!-- Pixel Coin Shadow Bottom-Right -->
  <rect x="160" y="352" width="224" height="32" fill="#d97706" />
  <rect x="352" y="160" width="32" height="224" fill="#d97706" />
  <!-- Pixel Dollar / Currency Symbol -->
  <rect x="224" y="160" width="64" height="32" fill="#1e1e1e" />
  <rect x="192" y="192" width="32" height="64" fill="#1e1e1e" />
  <rect x="224" y="240" width="64" height="32" fill="#1e1e1e" />
  <rect x="288" y="256" width="32" height="64" fill="#1e1e1e" />
  <rect x="224" y="320" width="64" height="32" fill="#1e1e1e" />
  <!-- Vertical Stems -->
  <rect x="240" y="140" width="32" height="32" fill="#1e1e1e" />
  <rect x="240" y="340" width="32" height="32" fill="#1e1e1e" />
  <!-- Pixel Sparkles -->
  <rect x="384" y="80" width="32" height="32" fill="#ffffff" />
  <rect x="96" y="384" width="24" height="24" fill="#fef08a" />
</svg>
